<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>グループ2 8月アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FAF6EE;
    --cream-deep: #F1EADB;
    --opt-bg: #F6EFE2;
    --ink: #34302A;
    --ink-soft: #6B6459;
    --clay: #AD6748;
    --clay-soft: #E7CFC1;
    --sage: #8C9574;
    --sage-soft: #DDE2CE;
    --line: #E4DBCB;
    --white: #FFFFFF;
    --radius: 20px;
    --shadow: 0 2px 14px rgba(90, 70, 50, 0.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 400px at 50% -80px, rgba(185,199,206,0.30), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400;
    min-height:100vh;
    padding-bottom:64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px;}

  .hero{
    padding:34px 0 22px;
    text-align:center;
  }
  .hero .eyebrow{
    font-size:10px;
    letter-spacing:.5em;
    color:var(--clay);
    margin-bottom:12px;
  }
  .hero .eyebrow .rule{color:var(--line);}
  .hero h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:19px;
    margin:0;
    color:var(--ink);
    line-height:1.5;
  }

  .card{
    background:var(--white);
    border-radius:var(--radius);
    padding:26px 20px 28px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .card .anon-note{
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 24px;
  }

  .qblock{margin-bottom:26px;}
  .qtext{
    font-size:13px;
    color:var(--ink);
    line-height:1.75;
    margin:0 0 12px;
    font-weight:500;
  }
  .qtext .qtag{
    display:inline-block;
    font-size:9px;
    color:var(--clay);
    margin-right:2px;
  }

  .opt-list{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--opt-bg);
    border:none;
    border-radius:14px;
    padding:12px 16px;
    font-size:12.5px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt:active{transform:scale(0.98);}
  .opt.selected{
    background:linear-gradient(90deg, rgba(140,149,116,0.22), rgba(173,103,72,0.20));
    box-shadow: inset 0 0 0 1.5px var(--clay);
    font-weight:600;
  }

  .sub-field{margin-top:12px; display:none;}
  .sub-field.show{display:block;}
  .sub-field label{
    display:block;
    font-size:10px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  textarea{
    width:100%;
    border:none;
    border-radius:14px;
    padding:13px 14px;
    font-size:12.5px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    background:var(--opt-bg);
    color:var(--ink);
    line-height:1.7;
    min-height:84px;
    resize:vertical;
  }
  textarea::placeholder{color:#B0A794;}

  .btn{
    width:100%;
    padding:15px;
    border-radius:18px;
    border:none;
    font-size:13px;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease;
    margin-top:6px;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink); color:var(--cream);}
  .btn-primary:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .hint-bottom{
    font-size:9.5px; color:var(--ink-soft); text-align:center; margin-top:11px; line-height:1.8;
  }

  .admin-link-wrap{text-align:center; padding:6px 0 20px;}
  .admin-link{
    background:none; border:none; color:var(--ink-soft);
    font-size:11px; cursor:pointer; padding:8px;
    text-decoration:underline; text-underline-offset:3px;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }

  /* thank you screen */
  .done-wrap{display:none; text-align:center; padding:60px 20px;}
  .done-wrap.show{display:block;}
  .done-wrap .fox{font-size:39px; display:block; margin-bottom:16px;}
  .done-wrap h2{font-family:'Shippori Mincho', serif; font-size:16px; margin:0 0 12px; color:var(--ink);}
  .done-wrap p{font-size:11.5px; color:var(--ink-soft); line-height:2; margin:0;}
  .form-area.hide{display:none;}

  /* admin overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(52,48,42,0.5);
    display:none; align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .overlay.show{display:flex;}
  .pw-modal{
    background:var(--white); border-radius:20px; padding:26px 22px; width:100%; max-width:340px;
  }
  .pw-modal h3{font-family:'Shippori Mincho', serif; font-size:13.5px; margin:0 0 14px; color:var(--ink);}
  .pw-modal input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:12.5px; background:var(--cream); color:var(--ink); margin-bottom:10px;
  }
  .pw-modal .pw-error{font-size:10px; color:var(--clay); margin-bottom:10px; display:none;}
  .pw-modal .pw-error.show{display:block;}
  .pw-actions{display:flex; gap:8px;}
  .pw-actions .btn{margin-top:0; padding:13px; font-size:13px;}
  .btn-secondary{background:var(--cream-deep); color:var(--ink);}

  /* admin dashboard */
  .admin-wrap{display:none;}
  .admin-wrap.show{display:block;}
  .admin-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .admin-header h1{font-family:'Shippori Mincho', serif; font-size:16px; margin:0;}
  .admin-back{background:none; border:none; color:var(--clay); font-size:11px; cursor:pointer; text-decoration:underline;}
  .admin-count{font-size:10.5px; color:var(--ink-soft); margin-bottom:18px;}

  .result-card{background:var(--white); border-radius:18px; padding:18px 16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .result-q{font-size:11.5px; font-weight:600; color:var(--ink); margin:0 0 13px; line-height:1.7;}
  .bar-row{margin-bottom:9px;}
  .bar-label{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-soft); margin-bottom:4px;}
  .bar-bg{height:8px; background:var(--cream-deep); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--sage), var(--clay)); border-radius:6px;}
  .free-list{display:flex; flex-direction:column; gap:8px;}
  .free-item{background:var(--cream); border-radius:12px; padding:10px 12px; font-size:11.5px; color:var(--ink); line-height:1.7;}
  .free-empty{font-size:10.5px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">— グループ2 —</div>
    <h1>グループ2 売り上げUP道場<br>8月アンケート</h1>
  </div>

  <div class="form-area" id="formArea">
    <div class="card">
      <p class="anon-note">※匿名で回答されます。名前などは記録されません。</p>
      <div id="questionsContainer"></div>
      <button class="btn btn-primary" id="submitBtn" disabled>📩 回答を送信する</button>
      <div class="hint-bottom" id="submitHint">選択式の質問（Q1〜Q9）にすべて回答すると送信できます</div>
    </div>

    <div class="hint-bottom" style="margin-top:14px;">送信すると、まみさんへ直接メールで届きます</div>
  </div>

  <div class="done-wrap" id="doneWrap">
    <span class="fox">🦊</span>
    <h2>回答ありがとうございました</h2>
    <p>あたたかいご協力に感謝します。<br>いただいた声は、来月の活動に大切に活かしていきます。</p>
  </div>

</div>

<script>
(function(){
  // 回答は FormSubmit というサービスを使い、送信するとまみさんのメールに直接届きます
  const NOTIFY_EMAIL = 'foxy8127mami@gmail.com';
  const FORMSUBMIT_URL = 'https://formsubmit.co/ajax/' + NOTIFY_EMAIL;

  const scaleOptions = ['そう思う','ややそう思う','あまりそう思わない','そう思わない'];


  const questions = [
    { id:'q1', num:1, type:'scale', text:'グループ2の雰囲気は良かったと感じますか？' },
    { id:'q2', num:2, type:'scale', text:'先月と比べて、グループ2への慣れや安心感は増しましたか？' },
    { id:'q3', num:3, type:'scale', text:'他のメンバーの投稿や工夫を見て、自分の活動の参考になったと感じますか？' },
    { id:'q4', num:4, type:'scale', text:'今月の課題は、今後の活動に活かせそうだと感じますか？' },
    { id:'q5', num:5, type:'scale', text:'Zoom会議の頻度・時間は適切だったと感じますか？' },
    { id:'q6', num:6, type:'scale', text:'グループ内で気軽に発言・相談できましたか？' },
    { id:'q7', num:7, type:'scale', text:'グループ2での学びが、実際の売上やフォロワー数などの成果につながったと感じますか？' },
    { id:'q9', num:8, type:'scale', text:'グループ2の活動の中で、大変だった・負担に感じたことはありますか？',
      sub:{ id:'q9_detail', label:'よろしければ、内容を教えてください（任意）', triggerOn:['そう思う','ややそう思う'] } },
    { id:'q10', num:9, type:'scale', text:'2ヶ月間で、他のメンバーの変化や成長を感じた瞬間はありましたか？' },
    { id:'q11', num:10, type:'text', tag:'（任意）', text:'グループ2があったことで、自分自身が変わったと感じることがあれば教えてください' },
    { id:'q12', num:11, type:'text', tag:'（任意）', text:'全体の感想、来月で最後ですが、意気込みや「やってほしいこと」があれば自由にどうぞ' }
  ];


  const answers = {};
  const container = document.getElementById('questionsContainer');
  const requiredIds = questions.filter(q=>q.type==='scale').map(q=>q.id);

  function updateSubmitState(){
    const answeredRequired = requiredIds.filter(id=>answers[id]).length;
    document.getElementById('submitBtn').disabled = answeredRequired < requiredIds.length;
  }

  questions.forEach(q=>{
    const block = document.createElement('div');
    block.className = 'qblock';

    const qtext = document.createElement('p');
    qtext.className = 'qtext';
    let prefix = q.num + '. ';
    if(q.tag) prefix += '';
    qtext.textContent = prefix + (q.tag ? q.tag+' ' : '') + q.text;
    block.appendChild(qtext);

    if(q.type === 'scale'){
      const optList = document.createElement('div');
      optList.className = 'opt-list';
      scaleOptions.forEach(opt=>{
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt';
        btn.textContent = opt;
        btn.addEventListener('click', ()=>{
          answers[q.id] = opt;
          optList.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
          btn.classList.add('selected');
          if(q.sub){
            const subEl = document.getElementById(q.sub.id+'_wrap');
            if(q.sub.triggerOn.includes(opt)){
              subEl.classList.add('show');
            } else {
              subEl.classList.remove('show');
              answers[q.sub.id] = '';
              const ta = subEl.querySelector('textarea');
              if(ta) ta.value = '';
            }
          }
          updateSubmitState();
        });
        optList.appendChild(btn);
      });
      block.appendChild(optList);

      if(q.sub){
        const subWrap = document.createElement('div');
        subWrap.className = 'sub-field';
        subWrap.id = q.sub.id+'_wrap';
        const label = document.createElement('label');
        label.textContent = q.sub.label;
        subWrap.appendChild(label);
        const ta = document.createElement('textarea');
        ta.placeholder = '自由に入力してください';
        ta.addEventListener('input', ()=>{ answers[q.sub.id] = ta.value; });
        subWrap.appendChild(ta);
        block.appendChild(subWrap);
      }
    } else if(q.type === 'text'){
      const ta = document.createElement('textarea');
      ta.placeholder = '自由に入力してください';
      ta.addEventListener('input', ()=>{ answers[q.id] = ta.value; });
      block.appendChild(ta);
    }

    container.appendChild(block);
  });

  updateSubmitState();

  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';

    const fd = new FormData();
    fd.append('_subject', 'グループ2 8月アンケート回答');
    fd.append('_template', 'table');
    fd.append('_captcha', 'false');

    questions.forEach(q=>{
      const label = q.num + '. ' + q.text;
      fd.append(label, answers[q.id] || '（未回答）');
      if(q.sub){
        fd.append(label + '（自由記述）', answers[q.sub.id] || '');
      }
    });
    fd.append('送信日時', new Date().toLocaleString('ja-JP'));

    try{
      const res = await fetch(FORMSUBMIT_URL, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: fd
      });
      if(!res.ok) throw new Error('送信失敗: ' + res.status);
    }catch(e){
      console.error('送信エラー', e);
      submitBtn.disabled = false;
      submitBtn.textContent = '📩 回答を送信する';
      document.getElementById('submitHint').textContent = '送信に失敗しました：' + (e && e.message ? e.message : e);
      return;
    }

    document.getElementById('formArea').classList.add('hide');
    document.getElementById('doneWrap').classList.add('show');
  });

})();
</script>
</body>
</html>
